name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (Ubuntu, build qemu from source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains and qemu build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
              gcc-arm-none-eabi binutils-arm-none-eabi \
              gcc-arm-linux-gnueabihf \
              libglib2.0-dev ninja-build pkg-config python3-venv

      - name: Build plugin-enabled qemu-arm + qemu-system-arm
        # Ubuntu's distro qemu is built without --enable-plugins, so we
        # build a minimal arm-linux-user + arm-softmmu pair from source.
        run: make qemu

      - name: Cortex-M4 cycle count — bare-metal path
        # set -o pipefail catches make failures inside $(make ... | awk ...).
        # First do a verbose run so any toolchain failure shows up in logs.
        run: |
          set -eo pipefail
          echo "=== verbose first run (so any error shows in the log) ==="
          make count ITERS=1000 MSG_LEN=64
          echo "=== sweep ==="
          BASE=$(make -s count ITERS=0      2>&1 | awk '/insns retired/{print $3}')
          A=$(   make -s count ITERS=1000   2>&1 | awk '/insns retired/{print $3}')
          B=$(   make -s count ITERS=11000  2>&1 | awk '/insns retired/{print $3}')
          per_iter=$(( (B - A) / 10000 ))
          echo "baseline (ITERS=0):                     $BASE insns"
          echo "ITERS=1000  MSG_LEN=64 total insns:     $A"
          echo "ITERS=11000 MSG_LEN=64 total insns:     $B"
          echo "per-iter SHA-256(64B) on bare-metal M4: $per_iter"
          # Naive pure-C SHA-256 at -O2 should land in this band.
          [ "$per_iter" -ge 5000 ] && [ "$per_iter" -le 9000 ] \
              || { echo "FAIL: per-iter out of expected range"; exit 1; }

      - name: Userspace Linux cross-check
        # Compares digest between the host build and the ARM userspace build,
        # then reports a per-iter count from qemu-arm + plugin.
        run: |
          make count-linux ITERS=1000 MSG_LEN=64

  macos:
    name: macOS (Homebrew toolchain)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arm-none-eabi-gcc
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.2.Rel1'

      - name: Install QEMU (Homebrew)
        run: brew install qemu

      - name: Probe QEMU plugin support; fall back to source build if needed
        # Most Homebrew bottles of qemu are built with --enable-plugins, but
        # if the bottle ever stops shipping them, build from source instead.
        run: |
          if qemu-system-arm -h 2>&1 | grep -q -- '-plugin'; then
              echo "Homebrew qemu-system-arm has --enable-plugins ✓"
          else
              echo "Homebrew qemu lacks plugins; building from source"
              brew install ninja glib pkg-config python@3.12
              make qemu
              echo "QEMU_SYSTEM=$PWD/qemu/build/qemu-system-arm" >> "$GITHUB_ENV"
              echo "QEMU_USER=$PWD/qemu/build/qemu-arm"          >> "$GITHUB_ENV"
          fi

      - name: Cortex-M4 cycle count — bare-metal path
        run: |
          set -e
          BASE=$(make -s count ITERS=0 2>&1 | awk '/insns retired/{print $3}')
          A=$(make -s count ITERS=1000  MSG_LEN=64 2>&1 | awk '/insns retired/{print $3}')
          B=$(make -s count ITERS=11000 MSG_LEN=64 2>&1 | awk '/insns retired/{print $3}')
          per_iter=$(( (B - A) / 10000 ))
          echo "baseline (ITERS=0):                    $BASE insns"
          echo "ITERS=1000  MSG_LEN=64 total insns:    $A"
          echo "ITERS=11000 MSG_LEN=64 total insns:    $B"
          echo "per-iter SHA-256(64B) on bare-metal M4: $per_iter"
          [ "$per_iter" -ge 5000 ] && [ "$per_iter" -le 9000 ] \
              || { echo "FAIL: per-iter out of expected range"; exit 1; }

      - name: Verify digest matches host
        run: |
          cc -O2 -o bench-host bench.c sha256.c
          ./bench-host 1000 64 > /tmp/d-host.txt
          make -s count ITERS=1000 MSG_LEN=64 2>&1 | grep -E '^[0-9a-f]{64}$' > /tmp/d-m4.txt
          diff /tmp/d-host.txt /tmp/d-m4.txt && echo "macOS host digest == bare-metal M4 digest ✓"
